<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/calculator-icon.png">
</head>
<body>
    <div class="container">
        <div class="display">0</div>
        <div class="buttons">
            <button type="button" id="clearBtn" class="extra-buttons">AC</button>
            <button type="button" id="plusMinusBtn" class="extra-buttons">+/-</button>
            <button type="button" id="percentBtn" class="extra-buttons">%</button>
            <button type="button" class="operator" name="divide">&divide;</button>
            
            <button type="button" class="number">7</button>
            <button type="button" class="number">8</button>
            <button type="button" class="number">9</button>
            <button type="button" class="operator" name="multiply">&times;</button>

            <button type="button" class="number">4</button>
            <button type="button" class="number">5</button>
            <button type="button" class="number">6</button>
            <button type="button" class="operator" name="subtract">&minus;</button>
            
            <button type="button" class="number">1</button>
            <button type="button" class="number">2</button>
            <button type="button" class="number">3</button>
            <button type="button" class="operator" name="add">&plus;</button>
            
            <button type="button" class="decimal-separator">&comma;</button>
            <button type="button" class="number" id="zero">0</button>
            <button type="button" id="delBtn" class="extra-buttons">&#9003;</button>
            <button type="button" id="equalsBtn">&equals;</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
