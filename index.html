<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/calculator-icon.png">
</head>
<body>
    <div class="container">
        <div class="display">0</div>
        <div class="buttons">
            <button type="button" id="delBtn">⌫</button>
            <button type="button" id="clearBtn">AC</button>
            <button type="button" id="plusMinusBtn">+/-</button>
            <button type="button" id="percentBtn" >%</button>
            
            <button type="button" class="number">7</button>
            <button type="button" class="number">8</button>
            <button type="button" class="number">9</button>
            <button type="button" class="operator" name="divide">/</button>

            <button type="button" class="number">4</button>
            <button type="button" class="number">5</button>
            <button type="button" class="number">6</button>
            <button type="button" class="operator" name="multiply">*</button>
            
            <button type="button" class="number">1</button>
            <button type="button" class="number">2</button>
            <button type="button" class="number">3</button>
            <button type="button" class="operator" name="subtract">-</button>
            
            <button type="button" class="decimal-separator">,</button>
            <button type="button" class="number" id="zero">0</button>
            <button type="button" id="equalsBtn">=</button>
            <button type="button" class="operator" name="add">+</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
